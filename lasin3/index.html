<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pet Spa - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor-login">
        <h2>Login</h2>
        <p>Ingresa para consentir a tu mejor amigo</p>
        <form>
            <div class="campo">
                <label>Usuario / Email</label>
                <input type="text" placeholder="Ej: Firulais123" required>
            </div>
            <div class="campo">
                <label>Contraseña</label>
                <input type="password" placeholder="********" minlength="8" required>
            </div>
            <button type="submit">Entrar al Spa</button>
        </form>
        <div class="enlaces">
            <a href="recuperar.html">¿Olvidaste tu contraseña?</a><br><br>
            <span>¿Eres nuevo? <a href="registro.html">Regístrate aquí</a></span>
        </div>
    </div>
</body>
</html>
